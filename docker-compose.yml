services:
  postgres:
    image: postgres:16-alpine
    container_name: concurrency-bench-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-concurrency_bench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-concurrency_bench}
      POSTGRES_DB: ${POSTGRES_DB:-concurrency_bench}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-concurrency_bench} -d ${POSTGRES_DB:-concurrency_bench}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
