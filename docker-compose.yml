services:
  postgres:
    image: postgres:16-alpine
    container_name: concurrency-lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-concurrency_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-concurrency_lab}
      POSTGRES_DB: ${POSTGRES_DB:-concurrency_lab}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-concurrency_lab} -d ${POSTGRES_DB:-concurrency_lab}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
