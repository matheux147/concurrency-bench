[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "concurrency-lab"
version = "0.1.0"
description = "Laboratório didático de programação concorrente em Python."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1.0",
    "psutil>=7.0,<8.0",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2,<3",
    "streamlit>=1.30,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
